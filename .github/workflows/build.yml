name: Build WXR-5950AX12 NSS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'qosmio/openwrt-ipq branch, tag, or full commit SHA'
        required: true
        default: '25.12-nss'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-dev rsync swig unzip zlib1g-dev file wget zstd \
            ca-certificates curl patch bzip2 xz-utils cpio time \
            libelf-dev perl pkg-config

      - name: Fetch requested fork revision
        id: source
        env:
          FORK_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # init + shallow fetch also supports full commit SHAs, unlike clone --branch.
          git init openwrt
          git -C openwrt remote add origin https://github.com/qosmio/openwrt-ipq.git
          git -C openwrt fetch --depth=1 --no-tags origin "$FORK_REF"
          git -C openwrt checkout --detach FETCH_HEAD
          sha="$(git -C openwrt rev-parse HEAD)"
          short_sha="${sha:0:12}"
          printf 'sha=%s\nshort_sha=%s\n' "$sha" "$short_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > openwrt/fork-commit.txt
          printf '### OpenWrt fork revision\n\nCommit: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select device and packages
        working-directory: openwrt
        run: |
          set -euo pipefail
          cp nss-setup/config-nss.seed .config
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          device = "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_buffalo_wxr-5950ax12"
          packages = []
          for number, raw in enumerate(Path("../config/packages.txt").read_text().splitlines(), 1):
              name = raw.split("#", 1)[0].strip()
              if not name:
                  continue
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9+_.-]*", name):
                  raise SystemExit(f"Invalid package on line {number}: {name!r}")
              packages.append(f"CONFIG_PACKAGE_{name}")
          required = list(dict.fromkeys([device, *packages]))
          # The seed enables tcpdump; tcpdump-mini installs the same executable.
          disabled = {"CONFIG_PACKAGE_tcpdump"} if "CONFIG_PACKAGE_tcpdump-mini" in packages else set()
          if disabled.intersection(packages):
              raise SystemExit("Choose only one of tcpdump and tcpdump-mini")
          lines = []
          for line in Path(".config").read_text().splitlines():
              symbol = line.removeprefix("# ").split("=", 1)[0].split(" ", 1)[0]
              if symbol in required:
                  continue
              if symbol in disabled:
                  continue
              if re.fullmatch(r"CONFIG_TARGET_.*_DEVICE_.*=y", line):
                  line = f"# {symbol} is not set"
              lines.append(line)
          lines.extend(f"# {symbol} is not set" for symbol in sorted(disabled))
          lines.extend(f"{symbol}=y" for symbol in required)
          Path(".config").write_text("\n".join(lines) + "\n")
          (Path(os.environ["RUNNER_TEMP"]) / "required-symbols.txt").write_text(
              "\n".join(required) + "\n"
          )
          PY
          make defconfig

      - name: Verify resolved configuration
        working-directory: openwrt
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r symbol; do
            if ! grep -Fxq -- "${symbol}=y" .config; then
              printf 'Required configuration missing: %s=y\n' "$symbol" >&2
              missing=1
            fi
          done < "$RUNNER_TEMP/required-symbols.txt"
          while IFS= read -r line; do
            if [[ "$line" != 'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_buffalo_wxr-5950ax12=y' ]]; then
              printf 'Unexpected device enabled: %s\n' "$line" >&2
              missing=1
            fi
          done < <(grep -E '^CONFIG_TARGET_.*_DEVICE_.*=y$' .config || true)
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ steps.source.outputs.sha }}-${{ hashFiles('config/packages.txt') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ steps.source.outputs.sha }}-
            ${{ runner.os }}-openwrt-dl-

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware and build metadata
        run: |
          set -euo pipefail
          target_dir="openwrt/bin/targets/qualcommax/ipq807x"
          mkdir -p artifacts
          shopt -s nullglob
          firmware=("$target_dir"/*buffalo_wxr-5950ax12*)
          manifests=("$target_dir"/*.manifest)
          if (( ${#firmware[@]} == 0 || ${#manifests[@]} == 0 )); then
            printf 'Firmware or manifest is missing in %s\n' "$target_dir" >&2
            exit 1
          fi
          cp -- "${firmware[@]}" artifacts/
          cp -- "${manifests[@]}" artifacts/
          for metadata in sha256sums config.buildinfo feeds.buildinfo version.buildinfo; do
            cp -- "$target_dir/$metadata" artifacts/
          done
          cp -- openwrt/fork-commit.txt artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wxr-5950ax12-nss-${{ steps.source.outputs.short_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
