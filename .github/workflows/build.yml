name: Build WXR-5950AX12 NSS EDMA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'JuliusBairaktaris/openwrt-nss-edma branch, tag, or full 40-digit commit SHA'
        required: true
        default: 'nss-edma-rework'
        type: string
      builder_ref:
        description: 'JuliusBairaktaris/Qualcommax_NSS_Builder branch, tag, or full 40-digit commit SHA'
        required: true
        default: '016581e7911a7bf273b4fc072fc5d133d13a5409'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-dev rsync swig unzip zlib1g-dev file wget zstd \
            ca-certificates curl patch bzip2 xz-utils cpio time \
            libelf-dev perl pkg-config

      - name: Fetch requested fork revision
        id: source
        env:
          FORK_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # init + shallow fetch also supports full commit SHAs, unlike clone --branch.
          git init openwrt
          git -C openwrt remote add origin https://github.com/JuliusBairaktaris/openwrt-nss-edma.git
          git -C openwrt fetch --depth=1 --no-tags origin -- "$FORK_REF"
          git -C openwrt checkout --detach FETCH_HEAD
          sha="$(git -C openwrt rev-parse HEAD)"
          short_sha="${sha:0:12}"
          printf 'sha=%s\nshort_sha=%s\n' "$sha" "$short_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > openwrt/fork-commit.txt
          # shellcheck disable=SC2016 # Literal Markdown backticks in summary text.
          printf '### OpenWrt fork revision\n\nCommit: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch requested builder revision
        id: builder
        env:
          BUILDER_REF: ${{ inputs.builder_ref }}
        run: |
          set -euo pipefail
          git init builder
          git -C builder remote add origin https://github.com/JuliusBairaktaris/Qualcommax_NSS_Builder.git
          git -C builder fetch --depth=1 --no-tags origin -- "$BUILDER_REF"
          git -C builder checkout --detach FETCH_HEAD
          sha="$(git -C builder rev-parse HEAD)"
          printf 'sha=%s\nshort_sha=%s\n' "$sha" "${sha:0:12}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > openwrt/builder-commit.txt
          # shellcheck disable=SC2016 # Literal Markdown backticks in summary text.
          printf '\n### Builder revision\n\nCommit: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare feeds, patches, device and packages
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
          REQUIRED_CONFIG: ${{ runner.temp }}/required-config.txt
        run: |
          set -euo pipefail
          bash scripts/prepare-build.sh

      - name: Verify resolved configuration
        working-directory: openwrt
        run: |
          set -euo pipefail
          python3 ../scripts/configure.py verify \
            --config .config --required "$RUNNER_TEMP/required-config.txt"

      - name: Set reproducible-build environment
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)"
            printf 'TZ=UTC\nLC_ALL=C\nKBUILD_BUILD_USER=builder\nKBUILD_BUILD_HOST=github\n'
          } >> "$GITHUB_ENV"

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ steps.source.outputs.sha }}-${{ steps.builder.outputs.sha }}-${{ hashFiles('config/packages.txt', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ steps.source.outputs.sha }}-
            ${{ runner.os }}-openwrt-dl-

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware, APK packages and build metadata
        run: |
          set -euo pipefail
          target_dir="openwrt/bin/targets/qualcommax/ipq807x"
          mkdir -p artifacts
          shopt -s nullglob
          firmware=("$target_dir"/*buffalo_wxr-5950ax12*)
          images=("$target_dir"/*buffalo_wxr-5950ax12*sysupgrade.bin)
          manifests=("$target_dir"/*.manifest)
          if (( ${#images[@]} == 0 || ${#manifests[@]} == 0 )); then
            printf 'Firmware or manifest is missing in %s\n' "$target_dir" >&2
            exit 1
          fi
          cp -- "${firmware[@]}" artifacts/
          cp -- "${manifests[@]}" artifacts/
          for metadata in sha256sums config.buildinfo feeds.buildinfo version.buildinfo; do
            cp -- "$target_dir/$metadata" artifacts/
          done
          cp -- openwrt/fork-commit.txt openwrt/builder-commit.txt artifacts/
          cp -- config/packages.txt artifacts/
          # Keep repository paths: target kmods and feed packages can share names.
          # Include all generated APKs, including =m packages and their dependencies.
          apk_count=0
          while IFS= read -r -d '' source; do
            relative="${source#openwrt/bin/}"
            destination="artifacts/packages/$relative"
            mkdir -p -- "$(dirname -- "$destination")"
            cp -L -- "$source" "$destination"
            if [[ "$source" == *.apk ]]; then
              apk_count=$((apk_count + 1))
            fi
          done < <(find openwrt/bin -type f \( -name '*.apk' -o -name 'packages.adb' \
            -o -name 'index.json' -o -name 'APKINDEX.tar.gz' \) -print0)
          if (( apk_count == 0 )); then
            printf 'No APK packages found in openwrt/bin\n' >&2
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wxr-5950ax12-nss-edma-${{ steps.source.outputs.short_sha }}-${{ steps.builder.outputs.short_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
